[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-for-ai"
version = "0.3.0"
description = "A command-line utility to pack Python codebases into a single text file for AI context, with clipboard support."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Maksym Khlystun"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
# Accurate token counting (cl100k_base) instead of the built-in heuristic.
tokens = ["tiktoken>=0.5"]
# Respect .gitignore / .pyaiignore files.
gitignore = ["pathspec>=0.12"]
# Everything above.
all = ["tiktoken>=0.5", "pathspec>=0.12"]
# Development & testing.
dev = ["pytest>=7.0", "tiktoken>=0.5", "pathspec>=0.12"]

[project.urls]
Homepage = "https://github.com/Maksum867/py-ai"

[project.scripts]
pyai = "py_ai.cli:main"
py-ai = "py_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/py_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Rules ignored project-wide (with rationale):
# - BLE001: a CLI tool deliberately catches broad exceptions to turn them
#   into friendly messages / graceful fallbacks (clipboard, pathspec,
#   tiktoken, output write).
# - S110:   tiktoken fallback intentionally swallows the exception and
#   silently degrades to the heuristic token count.
# - DTZ005: the report timestamp is a human-friendly LOCAL time; making it
#   tz-aware would change the output format for no user benefit.
ignore = ["BLE001", "S110", "DTZ005"]